data:
  batch_size: 128
  color_jitter_strength: 0.05
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  dataset_backend: huggingface_stream
  max_skip_factor: 50
  num_workers: 1
  pin_mem: true
  shuffle_buffer_size: 64
  steps_per_epoch: 8500
  token_env: HF_TOKEN
  use_color_distortion: true
  use_gaussian_blur: true
  use_horizontal_flip: true
  streams:
  - name: imagenet1k
    dataset_name: ILSVRC/imagenet-1k
    split: train
    image_mode: pil
    image_key: image
    columns:
    - image
    weight: 2.0
  - name: imagenet22k
    dataset_name: timm/imagenet-22k-wds
    split: train
    image_mode: wds_jpg
    image_key: jpg
    weight: 2.0
  - name: finevision
    dataset_name: lightonai/FineVision_images
    split: train
    all_configs: true
    image_mode: pil
    image_key: image
    columns:
    - image
    weight: 1.0
  - name: innovator
    dataset_name: InnovatorLab/Innovator-VL-Instruct-46M
    split: train
    image_mode: pil_list
    image_key: images
    columns:
    - images
    weight: 1.0
  - name: megalith
    dataset_name: madebyollin/megalith-10m
    split: megalith
    image_mode: url
    image_key: url_highres
    fallback_keys:
    - url
    columns:
    - url
    - url_highres
    url_timeout: 5.0
    min_size: 48
    weight: 1.0
  - name: openimages
    dataset_name: dalle-mini/open-images
    split: train
    image_mode: url
    image_key: url
    status_key: status
    status_allow:
    - success
    columns:
    - url
    - status
    url_timeout: 5.0
    min_size: 48
    weight: 1.0
  - name: dfndr
    dataset_name: apple/DFNDR-12M
    split: train
    image_mode: url
    image_key: url.txt
    columns:
    - url.txt
    url_timeout: 5.0
    min_size: 48
    weight: 1.5
logging:
  folder: ./logs/multi-vitsmall16-hf-stream/
  write_tag: jepa
mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 16
  pred_mask_scale:
  - 0.15
  - 0.2
meta:
  copy_data: false
  load_checkpoint: false
  model_name: vit_small
  pred_depth: 6
  pred_emb_dim: 192
  read_checkpoint: null
  use_bfloat16: true
optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 10
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.0001
  start_lr: 0.0001
  warmup: 0
  weight_decay: 0.04
